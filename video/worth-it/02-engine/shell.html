<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;700&family=Dela+Gothic+One&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Pacifico&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1017;--surface:#151a24;--line:#262d3c;--fg:#e8ecf4;--muted:#9aa5b8;--accent:#ff6b6b;--ok:#6ee7a8;--body:'DM Sans',system-ui,sans-serif;--display:'Fraunces',Georgia,serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fdf6ec;--surface:#ffffff;--line:#e3d9c8;--fg:#003B49;--muted:#4d7580;--accent:#B8431F;--ok:#157a4a;color-scheme:light}}
:root[data-theme="light"]{--bg:#fdf6ec;--surface:#ffffff;--line:#e3d9c8;--fg:#003B49;--muted:#4d7580;--accent:#B8431F;--ok:#157a4a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 64px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:clamp(1.7rem,7.5vw,2.2rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:700}
p{margin:0}
.kicker{font:700 .72rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sub{color:var(--muted);margin-top:8px;font-size:.92rem}
.phone{position:relative;margin:18px auto 0;width:100%;aspect-ratio:9/16;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.phone canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.controls{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font:500 .92rem var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 16px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{flex:1 1 120px;min-width:0;accent-color:var(--accent);height:32px}
.time{font:400 .78rem ui-monospace,Menlo,monospace;color:var(--muted);min-width:6em;text-align:right}
.toggles{margin-top:8px;display:flex;gap:18px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.scenes{margin-top:10px;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.scene{flex:0 0 auto;width:152px;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;scroll-snap-align:start}
.scene[aria-current="true"]{border-color:var(--accent)}
.scene:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scene b{display:block;font:500 .72rem ui-monospace,Menlo,monospace;color:var(--accent);letter-spacing:.04em}
.scene span{display:block;margin-top:3px;font-size:.88rem;font-weight:700}
.scene small{display:block;margin-top:2px;color:var(--muted);font-size:.76rem}
.panel{margin-top:22px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel ul{margin:10px 0 0;padding-left:1.1em}
.panel li{margin-top:6px}
.note{color:var(--muted);font-size:.84rem;margin-top:10px}
{{EXTRA_CSS}}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">{{KICKER}}</p>
  <h1>{{HEADING}}</h1>
  <p class="sub">{{SUB}}</p>

  <div class="phone">
    <canvas id="cv" width="720" height="1280" role="img" aria-label="{{ARIA}}"></canvas>
  </div>

  <div class="controls">
    <button class="btn primary" id="play" type="button">Pause</button>
    <button class="btn" id="restart" type="button">Restart</button>
    <input id="scrub" type="range" min="0" max="{{DUR}}" step="0.01" value="0" aria-label="Timeline">
    <span class="time" id="time">0:00 / 0:{{DUR}}</span>
  </div>
  <div class="toggles">
    <label class="chk"><input type="checkbox" id="snd">Sound on</label>
    <label class="chk"><input type="checkbox" id="loop" checked>Loop</label>
  </div>

  <div class="scenes" id="scenes"></div>

{{BODY}}
</div>
<script>
{{SCRIPT}}
</script>
<script>
{{EXTRA_JS}}
</script>
</body>
</html>
