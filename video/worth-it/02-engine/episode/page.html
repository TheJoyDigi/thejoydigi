<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:wght@500&family=Fraunces:wght@700&family=Rajdhani:wght@500;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B22;--fg:#F4F7FF;--muted:#8F9BD6;--cyan:#2FE3D0;--ink:#05081F;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);font:500 16px 'Rajdhani',system-ui,sans-serif;padding-inline:16px}
.wrap{max-width:400px;margin:0 auto;padding-block:20px}h1{font:400 1.4rem 'Russo One',sans-serif;margin:0 0 12px}
.phone{position:relative;aspect-ratio:9/16;border:2px solid var(--cyan);border-radius:16px;overflow:hidden;background:#000}
.phone canvas{position:absolute;inset:0;width:100%;height:100%}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px}button{font:700 1rem 'Rajdhani',sans-serif;background:var(--cyan);color:var(--ink);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
input[type=range]{flex:1;min-width:0;accent-color:var(--cyan)}.time{font:400 .8rem ui-monospace,monospace;color:var(--muted)}
</style>
<div class="wrap"><h1>{{TITLE}}</h1><div class="phone"><canvas id="cv" width="540" height="960"></canvas></div>
<div class="bar"><button id="play" type="button">Play with sound</button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub"><span class="time" id="time"></span></div></div>
<script>
/*{{ENGINE}}*/
</script>
<script>
(function(){
  var WL=window.WL,cv=document.getElementById('cv'),ctx=cv.getContext('2d'),t=0,playing=false,last=0,actx=null,mix=null;
  var HQ=/[?&]hq=1/.test(location.search);
  function b64(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
  /* mix: bed ducks under the voice, fx never ducks, master limiter. Same graph as the Format Lab */
  function build(c,dest,off,lead,vbuf,fd){
    var bed=c.createGain(),fx=c.createGain(),vg=c.createGain(),BED=3.8,FX=1.5,DUCK=.5,base=c.currentTime+lead;
    bed.gain.value=BED;fx.gain.value=FX;[bed,fx,vg].forEach(function(n){n.connect(dest);});
    WL.PLAN.forEach(function(L){if(L.end<off)return;if(L.start<=off)bed.gain.setValueAtTime(BED*DUCK,base);else bed.gain.setTargetAtTime(BED*DUCK,base+Math.max(0,L.start-off-.06),.05);bed.gain.setTargetAtTime(BED,base+(L.end-off)+.05,.2);});
    WL.sound(WL.makeSynth(c,bed,off,fd,lead),WL.makeSynth(c,fx,off,fd,lead));
    var src=null;if(vbuf&&off<vbuf.duration){src=c.createBufferSource();src.buffer=vbuf;src.connect(vg);src.start(base,off);}
    return {nodes:[bed,fx,vg],src:src};
  }
  function chain(c){var m=c.createGain();m.gain.value=.92;var l=c.createDynamicsCompressor();l.threshold.value=-12;l.knee.value=10;l.ratio.value=5;l.attack.value=.003;l.release.value=.2;m.connect(l);l.connect(c.destination);return m;}
  window.renderMixPCM=async function(sr){
    sr=sr||48000;var len=Math.ceil(WL.DUR*sr),oc=new OfflineAudioContext(2,len,sr),m=chain(oc);
    var vb=WL.VOICE?await oc.decodeAudioData(b64(WL.VOICE)):null;build(oc,m,0,0,vb,WL.DUR);
    var r=await oc.startRendering(),L=r.getChannelData(0),R=r.getChannelData(1),o=new Int16Array(len*2);
    for(var k=0;k<len;k++){o[2*k]=Math.max(-1,Math.min(1,L[k]))*32767;o[2*k+1]=Math.max(-1,Math.min(1,R[k]))*32767;}
    var by=new Uint8Array(o.buffer),s='';for(var j=0;j<by.length;j+=0x8000)s+=String.fromCharCode.apply(null,by.subarray(j,j+0x8000));return btoa(s);
  };
  if(HQ)return;
  var vbuf=null,master=null;
  function stop(){if(mix){if(mix.src)try{mix.src.stop();}catch(e){}mix.nodes.forEach(function(n){try{n.disconnect();}catch(e){}});mix=null;}}
  function start(){stop();if(!actx||!playing)return;var off=t+.12;mix=build(actx,master,off,.12,vbuf,WL.DUR+1.3);}
  document.getElementById('play').onclick=function(){
    if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();master=chain(actx);if(WL.VOICE)actx.decodeAudioData(b64(WL.VOICE),function(b){vbuf=b;start();});}
    playing=!playing;if(t>=WL.DUR-.05)t=0;this.textContent=playing?'Pause':'Play';last=performance.now();if(playing)start();else stop();
  };
  document.getElementById('scrub').oninput=function(){t=this.value/1000*WL.DUR;if(playing)start();};
  function tick(now){var dt=Math.min(.1,(now-last)/1000);last=now;if(playing){t+=dt;if(t>=WL.DUR){t=0;start();}}
    WL.frame(t,cv);document.getElementById('scrub').value=Math.round(t/WL.DUR*1000);document.getElementById('time').textContent=t.toFixed(1)+' / '+WL.DUR.toFixed(1)+' s';requestAnimationFrame(tick);}
  document.fonts.ready.then(function(){requestAnimationFrame(tick);});
})();
</script>
