<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Bric";src:url("fonts/BricolageGrotesque.ttf");font-weight:200 800}
@font-face{font-family:"Space Mono";src:url("fonts/SpaceMono-Bold.ttf");font-weight:700}
html,body{margin:0;background:#111}
canvas{display:block;height:96vh;width:auto;margin:2vh auto}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Fonts must be ready before core.js/scene.js run: captions and slam boxes are measured at load time. */
const EP = new URLSearchParams(location.search).get('ep');
const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('failed to load ' + src)); document.body.appendChild(s); });
Promise.all(['800 20px "Bric"', '700 20px "Bric"', '400 20px "Bric"', '700 20px "Space Mono"'].map(f => document.fonts.load(f)))
  .then(() => load('../' + EP + '/out/clip.js'))
  .then(() => load('core.js'))
  .then(() => load('../' + EP + '/scene.js'))
  .then(() => boot())
  .catch(e => { window.__err = e.message; console.error(e.message); });
</script>
</body></html>
